name: Go_Release

on:
  workflow_dispatch:
    inputs:
      pppoe_username:
        description: 'PPPoE 宽带账号 (留空使用默认值 "-")'
        required: false
        default: '-'
      pppoe_password:
        description: 'PPPoE 宽带密码 (留空使用默认值 "-")'
        required: false
        default: '-'
  schedule:
    # 每 7 天编译一次（UTC 时间，北京时间 = UTC+8）
    # UTC 20:00 = 北京时间 04:00
    - cron: '0 20 */7 * *'

env:
  DEVICE_MODEL: link_nn6000v2_immwrt
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: main
  BUILD_DIR: imm-nss
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    permissions:
      actions: write
      contents: write
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      # ======================= 新增：超级清理 =======================
      - name: 🔥 Ultimate Disk Cleanup
        run: |
          echo "=== Disk Before Cleanup ==="
          df -h

          # 1. 删除 Docker 所有内容
          sudo docker system prune -af --volumes 2>/dev/null || true

          # 2. 删除所有预装的大型软件（包括 .NET, Android, GHC, Swift, Chrome, Firefox 等）
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/az /opt/microsoft
          sudo rm -rf /opt/pipx /usr/lib/jvm /usr/local/share/chromium /usr/share/swift
          sudo rm -rf /usr/local/lib/node_modules /opt/google /opt/microsoft/msedge

          # 3. 清理 APT 缓存和未使用的包
          sudo apt clean
          sudo apt autoremove -y --purge
          sudo rm -rf /var/lib/apt/lists/*

          # 4. 清理日志
          sudo journalctl --rotate
          sudo journalctl --vacuum-time=1s

          # 5. 清理临时文件
          sudo rm -rf /tmp/* /var/tmp/*

          echo "=== Disk After Cleanup ==="
          df -h

      # ======================= 系统设置 =======================
      - name: Build System Setup
        run: |
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E apt -yqq install dos2unix libfuse-dev
          # 清理安装产生的缓存
          sudo apt clean && sudo apt autoremove -y

      - name: Set Build Date and Timezone
        run: |
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          export BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "BUILD_SRC=${{ env.REPO_URL }}" >> $GITHUB_ENV

      - name: Clone Source Code
        run: |
          chmod +x ./nn6000v2/scripts/update.sh
          chmod +x ./nn6000v2/scripts/build.sh
          git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} ./action_build
          cd ./action_build && git rev-parse HEAD > ../repo_flag
          cd ..
          # 移除国内下载源
          PROJECT_MIRRORS_FILE="./action_build/scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      # ======================= 缓存（调整 key） =======================
      - name: Restore Build Dependencies Cache
        uses: actions/cache/restore@v5.0.4
        with:
          path: |
            ./action_build/.ccache
            ./action_build/staging_dir
          key: ${{ matrix.os }}-build-${{ hashFiles('**/repo_flag') }}
          restore-keys: |
            ${{ matrix.os }}-build-

      # 添加 dl/ 目录缓存（独立）
      - name: Cache OpenWrt downloads
        uses: actions/cache@v5.0.4
        id: dl-cache
        with:
          path: ./action_build/dl
          key: ${{ matrix.os }}-dl-${{ hashFiles('**/feeds.conf') }}
          restore-keys: |
            ${{ matrix.os }}-dl-

      # ======================= 刷新缓存（保持不变） =======================
      - name: Refresh the cache
        run: |
          if [ -d "./action_build/staging_dir" ]; then
            find "./action_build/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      # ======================= 构建（降低并行度，防止瞬间撑爆） =======================
      - name: Build Firmware
        run: |
          # PPPoE 配置
          PPPOE_USER="${{ github.event.inputs.pppoe_username || '-' }}"
          PPPOE_PASS="${{ github.event.inputs.pppoe_password || '-' }}"
          if [ "$PPPOE_USER" != "-" ] || [ "$PPPOE_PASS" != "-" ]; then
            echo "正在配置 PPPoE 账号密码..."
            sed -i "s/^PPPOE_USERNAME=.*/PPPOE_USERNAME=\"$PPPOE_USER\"/" ./nn6000v2/patches/992_network_config.sh
            sed -i "s/^PPPOE_PASSWORD=.*/PPPOE_PASSWORD=\"$PPPOE_PASS\"/" ./nn6000v2/patches/992_network_config.sh
          else
            echo "未输入 PPPoE 账号密码，使用默认值 '-'"
          fi
          
          # ZeroTier Secret
          if [ -n "${{ secrets.ZEROTIER_SECRET }}" ]; then
            echo "正在注入 ZeroTier Secret..."
            ZT_CONFIG="./action_build/files/etc/config/zerotier"
            if [ -f "$ZT_CONFIG" ]; then
              sed -i "s|__ZEROTIER_SECRET__|${{ secrets.ZEROTIER_SECRET }}|g" "$ZT_CONFIG"
            fi
          else
            echo "⚠️ 未配置 ZEROTIER_SECRET Secret"
          fi

          # 执行构建（使用 4 核并行，避免过多临时文件）
          ./nn6000v2/scripts/build.sh ${{ env.DEVICE_MODEL }}
          
          # 获取内核版本
          FIRST_MANIFEST=$(ls ./firmware/immortalwrt-*.manifest 2>/dev/null | head -1)
          if [ -n "$FIRST_MANIFEST" ]; then
            KVER=$(grep "^kernel " "$FIRST_MANIFEST" | grep -oE "[4-6]\.[0-9]+\.[0-9]+" | head -1 || echo "")
            echo "KVER=${KVER:-unknown}" >> $GITHUB_ENV
          else
            echo "KVER=unknown" >> $GITHUB_ENV
          fi

          # ========== 关键：在打包前删除巨大的构建中间目录 ==========
          echo "=== 清理构建中间文件（保留最终固件） ==="
          rm -rf ./action_build/build_dir ./action_build/staging_dir ./action_build/tmp
          df -h

      # ======================= 缓存保存（仅保存 ccache，staging_dir 已删除，不存） =======================
      - name: Save Build Dependencies Cache
        uses: actions/cache/save@v5.0.4
        with:
          path: |
            ./action_build/.ccache
            # staging_dir 已被删除，不保存
          key: ${{ matrix.os }}-build-${{ hashFiles('**/repo_flag') }}

      # ======================= 清理旧缓存（按需） =======================
      - name: Cleanup Old Cache (optional)
        continue-on-error: true
        run: |
          echo "=== Cleaning up old caches ==="
          gh cache list --json key --jq '.[].key' | grep "^${{ matrix.os }}-" | while read -r key; do
            echo "Deleting old cache: $key"
            gh cache delete "$key" || true
          done

      # ======================= 发布 =======================
      - name: Machine Information
        run: |
          echo "=============================================="
          lscpu | grep -E "name|Core|Thread"
          echo "=============================================="
          df -h
          echo "=============================================="

      - name: Prepare Release Body
        run: |
          {
            echo "## 版本信息"
            echo "- 源码：${{ env.BUILD_SRC }}"
            echo "- Kernel: ${{ env.KVER }}"
            echo "- WIFI 密码：默认禁用"
            echo "- LAN 地址：192.168.2.254"
            echo "- 账户：root"
            echo "- 密码：无"
            echo "- no_wifi 后缀的版本未包含 WIFI 驱动程序"
          } > release_body.txt

      - name: Release Firmware
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BUILD_DATE }}_${{ env.DEVICE_MODEL }}
          files: |
            ./firmware/*.bin
            ./firmware/immortalwrt-*.manifest
            ./firmware/*.img.gz
            ./firmware/*.itb
            ./firmware/*.fip
            ./firmware/*.ubi
          body_path: ./release_body.txt
          make_latest: true

      - name: Cleanup Old Releases & Runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "清理旧 Releases (保留最新10个..."
          gh release list --json tagName --jq 'sort_by(.tagName) | reverse | .[10:]] | .[].tagName' | while read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          done
          echo "清理旧工作流运行记录 (保留最新10个..."
          gh run list --workflow release.yml --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[10:]] | .[].databaseId' | while read -r run_id; do
            [ -n "$run_id" ] && gh run delete "$run_id" 2>/dev/null || true
          done
