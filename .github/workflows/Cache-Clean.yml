- name: 🔥 Aggressive disk space cleanup
  run: |
    echo "=== Before cleanup ==="
    df -h
    
    # 1. 删除 Docker 所有镜像、容器、卷
    sudo docker system prune -af --volumes 2>/dev/null || true
    
    # 2. 删除 GitHub 预装的大型工具（OpenWrt 编译不需要）
    sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
    sudo rm -rf /usr/local/.ghcup /opt/az /opt/microsoft /opt/pipx /usr/lib/jvm
    sudo rm -rf /usr/local/share/chromium /usr/share/swift /usr/local/lib/node_modules
    
    # 3. 删除 APT 缓存和旧内核
    sudo apt clean
    sudo apt autoremove -y
    sudo rm -rf /var/lib/apt/lists/*
    
    # 4. 删除日志文件
    sudo journalctl --rotate
    sudo journalctl --vacuum-time=1s
    
    # 5. 删除临时文件
    sudo rm -rf /tmp/* /var/tmp/*
    
    echo "=== After cleanup ==="
    df -h
